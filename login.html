<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florvvia | Login</title>
<link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>window.HEADER_ACTIVE='home';</script>
</head>
<body>
<header id="siteHeader" class="bg-white shadow-sm sticky top-0 z-50"></header>
<section class="max-w-md mx-auto px-4 py-8 sm:py-12">
  <div class="bg-white rounded-2xl shadow-lg p-5 sm:p-6">
    <h1 class="text-xl sm:text-2xl font-semibold text-pink-500 mb-1" id="title">Welcome back 🌸</h1>
    <p class="text-sm text-gray-400 mb-4">Login for cart, wishlist, orders & address book.</p>
    <div id="regNameBox" class="hidden"><input id="fName" placeholder="Full name" class="w-full border rounded-full px-4 py-2 text-sm mb-2"><input id="fPhone" placeholder="Phone (optional)" class="w-full border rounded-full px-4 py-2 text-sm mb-2"></div>
    <input id="fEmail" placeholder="Email" class="w-full border rounded-full px-4 py-2 text-sm mb-2">
    <input id="fPass" type="password" placeholder="Password" class="w-full border rounded-full px-4 py-2 text-sm mb-3">
    <button onclick="submit()" id="btn" class="btn-pink w-full">Login</button>
    <button onclick="toggle()" id="tog" class="w-full text-sm text-pink-500 mt-3">New here? Create account</button>
    <p id="err" class="text-xs text-red-500 mt-2"></p>
    <div class="text-xs text-gray-400 mt-4 bg-pink-50 rounded-lg p-3">Admin demo: <b>admin@florvvia.in / admin123</b><br>Admins get product/order/customer management.</div>
  </div>
</section>
<script src="js/common.js"></script>
<script>
let MODE = 'login';
function toggle() {
  MODE = MODE === 'login' ? 'register' : 'login';
  document.getElementById('regNameBox').classList.toggle('hidden', MODE === 'login');
  document.getElementById('title').textContent = MODE === 'login' ? 'Welcome back 🌸' : 'Join Florvvia 🌷';
  document.getElementById('btn').textContent = MODE === 'login' ? 'Login' : 'Create account';
  document.getElementById('tog').textContent = MODE === 'login' ? 'New here? Create account' : 'Have an account? Login';
}
async function submit() {
  const email = document.getElementById('fEmail').value.trim();
  const password = document.getElementById('fPass').value;
  try {
    let r;
    if (MODE === 'login') r = await API.post('/api/auth/login', { email, password });
    else {
      const name = document.getElementById('fName').value.trim();
      const phone = document.getElementById('fPhone').value.trim();
      if (!name) throw new Error('Enter your name');
      r = await API.post('/api/auth/register', { name, email, phone, password });
    }
    localStorage.setItem('florvvia_token', r.token);
    localStorage.setItem('florvvia_user', JSON.stringify(r.user));
    toast('Welcome, ' + r.user.name + ' 🌸');
    location.href = r.user.role === 'ADMIN' ? 'admin.html' : 'index.html';
  } catch (e) { document.getElementById('err').textContent = e.message; }
}
document.addEventListener('DOMContentLoaded', async () => { await loadConfig(); if (API.user()) location.href = 'account.html'; });
</script>
</body>
</html>
