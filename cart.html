<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florvvia | Cart</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>window.HEADER_ACTIVE='home';</script>
</head>
<body>
<header id="siteHeader" class="bg-white shadow-sm sticky top-0 z-50"></header>
<section class="max-w-4xl mx-auto px-4 sm:px-6 py-8">
  <h1 class="text-2xl font-semibold text-pink-500 mb-4">Your Cart 🛒</h1>
  <div id="items" class="space-y-3"></div>
  <div id="summary" class="mt-6 bg-white rounded-xl shadow p-4"></div>
</section>
<script src="js/common.js"></script>
<script>
async function init() {
  await loadConfig();
  const cart = await getCart();
  const box = document.getElementById('items');
  if (!cart.length) {
    box.innerHTML = '<div class="text-center py-12 text-gray-400">Cart is empty 🌷<br><a href="index.html" class="text-pink-500 font-medium">Continue shopping →</a></div>';
    document.getElementById('summary').innerHTML = '';
    return;
  }
  box.innerHTML = cart.map(ci => {
    const p = ci.product || ci;
    const qty = ci.qty || 1;
    const img = (p.images && p.images[0]) || p.image || 'images/flowers/flower1.jpg';
    return `<div class="bg-white rounded-xl shadow-sm p-3 flex gap-3 items-center">
      <img src="${img}" class="w-20 h-20 rounded-lg object-cover" onerror="this.src='images/flowers/flower1.jpg'">
      <div class="flex-1">
        <p class="font-medium text-sm">${p.name}</p>
        <p class="text-pink-600 font-semibold text-sm">${money(p.price)}</p>
        <div class="flex items-center gap-2 mt-1">
          <button onclick="chQty(${p.id},${qty - 1})" class="w-7 h-7 rounded-full border">−</button>
          <span class="text-sm w-6 text-center">${qty}</span>
          <button onclick="chQty(${p.id},${qty + 1})" class="w-7 h-7 rounded-full border">+</button>
          <button onclick="rm(${p.id})" class="text-xs text-red-400 ml-2">Remove</button>
        </div>
      </div>
      <b class="text-sm">${money(p.price * qty)}</b>
    </div>`;
  }).join('');
  const sub = cart.reduce((s, ci) => s + (ci.product.price * ci.qty), 0);
  const fee = sub >= SHOP_CONFIG.freeDeliveryAbove ? 0 : SHOP_CONFIG.deliveryFee;
  document.getElementById('summary').innerHTML = `
    <div class="text-sm space-y-1"><div class="flex justify-between"><span>Subtotal</span><b>${money(sub)}</b></div>
    <div class="flex justify-between"><span>Delivery ${fee === 0 ? '(FREE)' : ''}</span><b>${money(fee)}</b></div>
    <div class="flex justify-between text-lg font-semibold text-pink-600 pt-2 border-t"><span>Total</span><span>${money(sub + fee)}</span></div></div>
    <div class="flex gap-2 mt-4 flex-col sm:flex-row">
      <a href="checkout.html" class="flex-1 btn-pink">Checkout →</a>
      <a href="https://www.instagram.com/florvvia/" target="_blank" class="flex-1 btn-outline">Order on Instagram</a>
    </div>`;
}
async function chQty(id, qty) {
  const u = API.user();
  if (u && BACKEND_OK) { try { qty <= 0 ? await API.post('/api/cart/remove', { productId: id }) : await API.post('/api/cart/update', { productId: id, qty }); } catch (e) { toast(e.message); return; } }
  else {
    const c = localCart(); const it = c.find(x => String(x.productId) === String(id));
    if (it) { if (qty <= 0) c.splice(c.indexOf(it), 1); else it.qty = qty; saveLocalCart(c); }
  }
  init(); updateBadges();
}
async function rm(id) { chQty(id, 0); }
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
