<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florvvia | Product</title>
<link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>window.HEADER_ACTIVE='home';</script>
</head>
<body>
<header id="siteHeader" class="bg-white shadow-sm sticky top-0 z-50"></header>
<section class="max-w-5xl mx-auto px-3 sm:px-6 py-6 sm:py-8 grid md:grid-cols-2 gap-6 md:gap-8" id="wrap">
  <div><p class="text-gray-400">Loading…</p></div>
</section>
<section class="max-w-5xl mx-auto px-3 sm:px-6 pb-10 sm:pb-12">
  <h3 class="font-semibold text-base sm:text-lg mb-3">Reviews <span id="rCount" class="text-pink-500"></span></h3>
  <div id="reviews" class="space-y-3 mb-6"></div>
  <div class="bg-white rounded-xl shadow p-3 sm:p-4">
    <h4 class="font-medium mb-2 text-sm">Write a review</h4>
    <div class="flex gap-2 mb-2 flex-wrap">
      <select id="rvRating" class="border rounded-full px-3 py-2.5 text-sm"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select>
      <input id="rvText" placeholder="Share your experience…" class="flex-1 min-w-[160px] border rounded-full px-4 py-2.5 text-sm">
      <button onclick="postReview()" class="btn-pink !py-2.5 text-sm flex-shrink-0">Post</button>
    </div>
    <p class="text-xs text-gray-400">Login required to review. Admin can remove inappropriate reviews.</p>
  </div>
</section>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
let P = null;
async function init() {
  await loadConfig();
  const id = new URLSearchParams(location.search).get('id');
  let list = await fetchProducts();
  P = list.find(x => String(x.id) === String(id)) || list[0];
  if (!P) { document.getElementById('wrap').innerHTML = '<p>Product not found. <a href="index.html" class="text-pink-500">Back</a></p>'; return; }
  if (BACKEND_OK) { try { P = await API.get('/api/products/' + P.id); } catch {} }
  const img0 = imgUrl((P.images && P.images[0]) || 'images/flowers/flower1.jpg');
  document.getElementById('wrap').innerHTML = `
    <div class="relative">
      ${P.tag ? `<span class="product-tag">${P.tag}</span>` : ''}
      <img id="mainImg" src="${img0}" class="gallery-main shadow" onerror="this.src='images/flowers/flower1.jpg'">
      <div class="gallery-thumbs">${(P.images || [img0]).map((s, i) => `<img src="${imgUrl(s)}" onclick="document.getElementById('mainImg').src=imgUrl('${s}')" class="${i === 0 ? 'active' : ''}" onerror="this.style.display='none'">`).join('')}</div>
    </div>
    <div>
      <p class="text-xs text-gray-400 mb-1">${P.code || ''} • ${catLabel(P.category)}</p>
      <h1 class="text-2xl sm:text-3xl font-semibold text-pink-500 mb-2">${P.name}</h1>
      <p class="text-sm text-gray-500 mb-1">${P.ratingAvg ? '★ ' + P.ratingAvg + ' (' + (P.ratingCount || 0) + ' reviews)' : 'New arrival 🌷'}</p>
      <div class="product-price mb-3">${money(P.price)} ${P.mrp ? `<span class="text-sm text-gray-400 line-through font-normal">${money(P.mrp)}</span>` : ''}</div>
      <p class="mb-4 text-sm leading-relaxed">${P.description || ''}</p>
      <p class="mb-4 text-sm font-medium">Custom colours & bouquet options available 🌸 • Delivery 3–5 days</p>
      <div class="flex flex-col min-[420px]:flex-row gap-2 mb-3">
        <button onclick="addToCart(P.id)" class="flex-1 btn-pink">Add to Cart 🛒</button>
        <button onclick="toggleWishlist(P.id)" class="btn-outline">♡ Wishlist</button>
      </div>
      <a href="https://www.instagram.com/florvvia/" target="_blank" class="block mb-2 bg-pink-500 text-white px-6 py-3 rounded-full text-center font-medium">Order on Instagram</a>
      <a href="checkout.html?buy=${P.id}" class="block bg-pink-400 text-white px-6 py-3 rounded-full text-center font-medium">Buy Now → Checkout</a>
      <a href="index.html" class="block mt-4 text-sm text-pink-400">← Back to shop</a>
    </div>`;
  loadReviews();
}
async function loadReviews() {
  let revs = [];
  if (BACKEND_OK) { try { revs = await API.get('/api/reviews/product/' + P.id); } catch {} }
  document.getElementById('rCount').textContent = revs.length ? `(${revs.length})` : '';
  document.getElementById('reviews').innerHTML = revs.length ? revs.map(r => `
    <div class="bg-white rounded-xl shadow-sm p-3 text-sm">
      <b>${r.userName || 'Customer'}</b> <span class="text-pink-500">${'★'.repeat(r.rating)}</span>
      <p class="text-gray-600">${r.comment || ''}</p>
    </div>`).join('') : '<p class="text-sm text-gray-400">No reviews yet — be the first! 🌸</p>';
}
async function postReview() {
  if (!API.user()) { toast('Please login to review'); location.href = 'login.html'; return; }
  if (!BACKEND_OK) { toast('Reviews need backend running'); return; }
  try {
    await API.post('/api/reviews', { productId: P.id, rating: +document.getElementById('rvRating').value, comment: document.getElementById('rvText').value });
    document.getElementById('rvText').value = '';
    toast('Review posted 🌸'); loadReviews();
  } catch (e) { toast(e.message); }
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
