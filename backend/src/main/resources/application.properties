server.port=${PORT:8080}
spring.application.name=florvvia-backend

# Database: local H2 file by default; set SPRING_DATASOURCE_URL (+ username/password/driver)
# to use hosted Postgres when deployed (see README + render.yaml).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/florvvia;AUTO_SERVER=TRUE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (set APP_JWT_SECRET env var in production)
app.jwt.secret=${APP_JWT_SECRET:florvvia-super-secret-key-for-jwt-min-32-chars-1234567890}
app.jwt.expiration-ms=86400000

# Perf: gzip HTML/JSON/CSS/JS. Pages/scripts revalidate every visit (never stale);
# only photos are cached long-term (see WebConfig).
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/plain
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Shop config
app.whatsapp-number=917417566249
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
