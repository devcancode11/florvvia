server.port=8080
spring.application.name=florvvia-backend

# H2 file DB (persists in ./data). Admin can see all data in /h2-console.
spring.datasource.url=jdbc:h2:file:./data/florvvia;AUTO_SERVER=TRUE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=florvvia-super-secret-key-for-jwt-min-32-chars-1234567890
app.jwt.expiration-ms=86400000

# Shop config
app.whatsapp-number=917417566249
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
