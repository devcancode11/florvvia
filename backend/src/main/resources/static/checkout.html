<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florvvia | Checkout</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>window.HEADER_ACTIVE='home';</script>
</head>
<body>
<header id="siteHeader" class="bg-white shadow-sm sticky top-0 z-50"></header>
<section class="max-w-4xl mx-auto px-4 sm:px-6 py-8 grid md:grid-cols-2 gap-6">
  <div>
    <h1 class="text-2xl font-semibold text-pink-500 mb-4">Checkout</h1>
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <h3 class="font-medium mb-2 text-sm">Delivery address 📍</h3>
      <div id="addrList" class="space-y-2 mb-3"></div>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <input id="aName" placeholder="Full name" class="border rounded-lg px-3 py-2 col-span-2">
        <input id="aPhone" placeholder="Phone" class="border rounded-lg px-3 py-2 col-span-2">
        <input id="aLine1" placeholder="Address line 1" class="border rounded-lg px-3 py-2 col-span-2">
        <input id="aCity" placeholder="City" class="border rounded-lg px-3 py-2">
        <input id="aPin" placeholder="Pincode" class="border rounded-lg px-3 py-2">
        <input id="aState" placeholder="State" class="border rounded-lg px-3 py-2 col-span-2">
      </div>
      <p class="text-xs text-gray-400 mt-2">Set location via pincode + address. Logged-in users: address auto-saves to address book.</p>
    </div>
    <div class="bg-white rounded-xl shadow p-4">
      <h3 class="font-medium mb-2 text-sm">Payment 💳</h3>
      <label class="flex items-center gap-2 text-sm py-1"><input type="radio" name="pay" value="COD" checked> Cash on Delivery</label>
      <label class="flex items-center gap-2 text-sm py-1"><input type="radio" name="pay" value="UPI"> UPI <span id="upiId" class="text-gray-400 text-xs"></span></label>
      <label class="flex items-center gap-2 text-sm py-1"><input type="radio" name="pay" value="RAZORPAY"> Razorpay / Card (demo)</label>
      <label class="flex items-center gap-2 text-sm py-1"><input type="radio" name="pay" value="INSTAGRAM"> Confirm on Instagram</label>
      <div id="upiBox" class="hidden text-xs bg-pink-50 rounded-lg p-3 mt-2">Pay to UPI ID on delivery confirmation. You’ll get confirmation with your order ID.</div>
    </div>
  </div>
  <div>
    <div class="bg-white rounded-xl shadow p-4 sticky top-24">
      <h3 class="font-medium mb-2 text-sm">Order summary</h3>
      <div id="sumItems" class="space-y-2 text-sm max-h-64 overflow-auto"></div>
      <div id="sumTotal" class="mt-3 pt-3 border-t"></div>
      <button onclick="placeOrder()" id="payBtn" class="btn-pink w-full mt-4">Place Order</button>
      <p id="msg" class="text-xs text-gray-500 mt-2"></p>
    </div>
  </div>
</section>
<script src="js/common.js"></script>
<script>
let CART = [], SELECTED_ADDR = null;
async function init() {
  await loadConfig();
  document.getElementById('upiId').textContent = '(' + SHOP_CONFIG.upiId + ')';
  document.querySelectorAll('input[name=pay]').forEach(r => r.onchange = () => {
    document.getElementById('upiBox').classList.toggle('hidden', document.querySelector('input[name=pay]:checked').value !== 'UPI');
  });
  const buy = new URLSearchParams(location.search).get('buy');
  if (buy) {
    const all = await fetchProducts();
    const p = all.find(x => String(x.id) === String(buy));
    CART = p ? [{ product: p, qty: 1, buyNow: true }] : [];
  } else CART = await getCart();
  if (!CART.length) { document.getElementById('sumItems').innerHTML = '<p class="text-gray-400">Cart empty. <a class="text-pink-500" href="index.html">Shop →</a></p>'; return; }
  renderSum(); loadAddrs();
}
async function loadAddrs() {
  const u = API.user();
  if (!u || !BACKEND_OK) { document.getElementById('addrList').innerHTML = '<p class="text-xs text-gray-400">Login to use saved address book.</p>'; return; }
  try {
    const list = await API.get('/api/addresses');
    SELECTED_ADDR = (list.find(a => a.default) || list[0] || null)?.id || null;
    document.getElementById('addrList').innerHTML = list.length ? list.map(a => `
      <label class="flex gap-2 text-xs border rounded-lg p-2 cursor-pointer ${a.id === SELECTED_ADDR ? 'border-pink-400 bg-pink-50' : ''}">
        <input type="radio" name="addr" ${a.id === SELECTED_ADDR ? 'checked' : ''} onchange="SELECTED_ADDR=${a.id};loadAddrs()">
        <span><b>${a.fullName}</b> • ${a.phone}<br>${a.line1}, ${a.city || ''} ${a.pincode || ''} ${a.default ? '• <b>Default</b>' : ''}</span>
      </label>`).join('') : '<p class="text-xs text-gray-400">No saved addresses yet.</p>';
  } catch {}
}
function renderSum() {
  const sub = CART.reduce((s, ci) => s + ci.product.price * ci.qty, 0);
  const fee = sub >= SHOP_CONFIG.freeDeliveryAbove ? 0 : SHOP_CONFIG.deliveryFee;
  document.getElementById('sumItems').innerHTML = CART.map(ci => `<div class="flex justify-between"><span>${ci.product.name} ×${ci.qty}</span><b>${money(ci.product.price * ci.qty)}</b></div>`).join('');
  document.getElementById('sumTotal').innerHTML = `<div class="flex justify-between text-sm"><span>Delivery</span><b>${fee === 0 ? 'FREE' : money(fee)}</b></div><div class="flex justify-between font-semibold text-pink-600 text-lg"><span>Total</span><span>${money(sub + fee)}</span></div>`;
}
async function placeOrder() {
  const mode = document.querySelector('input[name=pay]:checked').value;
  const btn = document.getElementById('payBtn');
  btn.disabled = true; btn.textContent = 'Placing…';
  const payload = { paymentMode: mode };
  if (SELECTED_ADDR) payload.addressId = SELECTED_ADDR;
  else {
    payload.fullName = document.getElementById('aName').value;
    payload.phone = document.getElementById('aPhone').value;
    payload.line1 = document.getElementById('aLine1').value;
    payload.city = document.getElementById('aCity').value;
    payload.pincode = document.getElementById('aPin').value;
    payload.state = document.getElementById('aState').value;
    if (!payload.fullName || !payload.line1) { toast('Enter name + address'); btn.disabled = false; btn.textContent = 'Place Order'; return; }
  }
  const fromCart = !CART[0]?.buyNow;
  if (CART[0]?.buyNow) payload.items = [{ productId: CART[0].product.id, qty: 1 }];
  else if (!API.user()) payload.items = CART.map(ci => ({ productId: ci.product.id, qty: ci.qty })); // guests have no server-side cart
  try {
    if (!BACKEND_OK) {
      if (fromCart) { saveLocalCart([]); updateBadges(); } // clear cart even in demo mode
      toast('Demo mode — confirm your order on Instagram 💬');
      location.href = INSTA_URL;
      return;
    }
    if (mode === 'RAZORPAY') {
      document.getElementById('msg').textContent = 'Demo Razorpay: payment simulated as PAID on confirm (integrate Razorpay key for live).';
    }
    const order = await API.post('/api/orders', payload);
    if (fromCart && !API.user()) saveLocalCart([]); // guest cart cleared locally (server clears logged-in carts)
    CART = []; // prevent double-ordering
    document.getElementById('sumItems').innerHTML = '<p class="text-green-600 font-medium text-sm">✅ Order placed — cart cleared.</p>';
    document.getElementById('sumTotal').innerHTML = '';
    updateBadges();
    let html = `✅ Order <b>${order.orderNo}</b> placed! Total ${money(order.total)} (${order.paymentMode})`;
    html += `<br><b class="text-sm">📢 Tap below so we get notified instantly:</b>`;
    html += `<br><a class="inline-block mt-2 bg-green-500 text-white text-sm font-medium px-4 py-2 rounded-full" target="_blank" href="${order.whatsappLink}">Notify us on WhatsApp →</a>`;
    html += ` <a class="inline-block mt-2 bg-pink-500 text-white text-sm font-medium px-4 py-2 rounded-full" target="_blank" href="${INSTA_URL}">DM on Instagram →</a>`;
    html += `<br><a class="text-pink-500 text-sm" href="account.html?tab=orders">View my orders →</a>`;
    document.getElementById('msg').innerHTML = html;
    toast('Order placed 🎉');
    btn.disabled = true; btn.textContent = 'Order placed ✅';
    return; // keep button disabled to prevent double-ordering
  } catch (e) { toast(e.message); document.getElementById('msg').textContent = e.message; }
  btn.disabled = false; btn.textContent = 'Place Order';
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
